# Builds the macOS (Apple Silicon, Metal) and Windows (x86_64, Vulkan) CLI
# bundles and attaches them to the GitHub release.
#
# - A published release builds its tag and uploads both archives to it.
# - A manual run (Actions > cli-bundles > Run workflow) does the same for an
#   existing tag, e.g. to add the bundles to a release made before this workflow.
# - Pull requests that touch the packaging, the model download code or the
#   Metal/Vulkan backends only build and smoke-test (the only place pull and
#   Metal run on macOS and Windows); the
#   archives are kept as workflow artifacts.
# All three bundles come from scripts/package.sh; the Linux CUDA one stays
# manual (`scripts/package.sh linux-x86_64` needs a local NVRTC 13).
name: cli-bundles

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the bundles to (e.g. v0.16.0)"
        required: true
  pull_request:
    paths:
      - "scripts/package.sh"
      - "scripts/test_package.py"
      - "install.sh"
      - "install.ps1"
      - "scripts/test_install.py"
      - "src/hub/**"
      - "src/metal.rs"
      - "src/metal/**"
      - "src/vulkan.rs"
      - "src/vulkan/**"
      - "src/plt1.rs"
      - ".github/workflows/cli-bundles.yml"

permissions:
  contents: write

env:
  # Empty on pull requests: build and test only.
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            features: metal
            exe: palito
            archive: tar.gz
          - os: windows-latest
            platform: windows-x86_64
            features: vulkan
            exe: palito.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml
        if: env.TAG != ''
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match Cargo.toml $version" >&2; exit 1; }
      # On Windows, Python may start WSL's bash.exe; the smoke test covers it there.
      - name: Packaging script tests
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s scripts -p 'test_package.py'
      - name: Build and package (${{ matrix.features }})
        id: package
        run: |
          bash scripts/package.sh ${{ matrix.platform }}
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "name=palito-$version-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
      - name: Smoke test (pull a small GGUF from Hugging Face, generate on the CPU)
        env:
          PALITO_MODELS: ${{ runner.temp }}/models
        run: |
          bin="target/dist/${{ steps.package.outputs.name }}/${{ matrix.exe }}"
          "$bin" --version
          "$bin" list --available | grep qwen3-8b
          model="$("$bin" pull --quiet bartowski/SmolLM2-135M-Instruct-GGUF:SmolLM2-135M-Instruct-Q4_K_M.gguf)"
          "$bin" list | grep SmolLM2
          "$bin" generate --model "$model" --prompt "The capital of France is" --tokens 8 > cpu.json
          grep -q '"text":" Paris' cpu.json || { cat cpu.json; exit 1; }
          echo "MODEL=$model" >> "$GITHUB_ENV"
      # The GPU backend must produce the CPU's tokens (greedy) and refuse .palito
      # models. Hosted Windows runners have no Vulkan device: reported, not failed.
      - name: GPU smoke test (${{ matrix.features }})
        env:
          PALITO_MODELS: ${{ runner.temp }}/models
        run: |
          bin="target/dist/${{ steps.package.outputs.name }}/${{ matrix.exe }}"
          tokens() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sample"]["generated_tokens"])' "$1" 2>/dev/null \
            || python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sample"]["generated_tokens"])' "$1"; }
          if ! "$bin" generate --backend ${{ matrix.features }} --model "$MODEL" --prompt "The capital of France is" --tokens 8 > gpu.json 2> gpu.err; then
            cat gpu.err
            if [ "$RUNNER_OS" = Windows ] && grep -qi 'vulkan' gpu.err; then
              echo "::notice::no Vulkan device on this runner; Vulkan inference not tested here"
              exit 0
            fi
            exit 1
          fi
          cat gpu.json
          [ "$(tokens cpu.json)" = "$(tokens gpu.json)" ] || { echo "GPU tokens differ from CPU" >&2; exit 1; }
          printf 'PALITO1\0not a real bundle' > fake.palito
          if "$bin" generate --backend ${{ matrix.features }} --model fake.palito --prompt hi 2> refuse.err; then exit 1; fi
          grep -q 'cannot run .palito models' refuse.err || { cat refuse.err; exit 1; }
      - name: Metal backend tests
        if: runner.os == 'macOS'
        run: |
          mkdir -p models
          cp "$MODEL" models/SmolLM2-135M-Instruct-Q4_K_M.gguf
          cargo test --release --features metal --test metal -- --include-ignored
      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: target/dist/${{ steps.package.outputs.name }}.${{ matrix.archive }}
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "target/dist/${{ steps.package.outputs.name }}.${{ matrix.archive }}" --clobber

  # The one-line installers, run as users run them, against the release just
  # built (or the latest release on pull requests).
  install:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - name: Installer tests
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s scripts -p 'test_install.py'
      - name: install.sh (piped to sh, as in the README)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PALITO_VERSION="${TAG#v}"
          [ -n "$PALITO_VERSION" ] || unset PALITO_VERSION
          # Hosted runners already have ~/.local/bin on PATH; a new user does not.
          PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -vx "$HOME/.local/bin" | paste -sd: -)"
          cat install.sh | SHELL=/bin/zsh sh
          grep -q 'added by the palito installer' ~/.zshrc
          ~/.local/bin/palito --version
          ~/.local/bin/palito list --available | grep qwen3-8b
          # A second run upgrades in place without duplicating the PATH line.
          cat install.sh | SHELL=/bin/zsh sh
          [ "$(grep -c 'added by the palito installer' ~/.zshrc)" = 1 ]
      - name: install.ps1 (Windows PowerShell 5.1, piped to iex as in the README)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($env:TAG) { $env:PALITO_VERSION = $env:TAG.TrimStart('v') }
          Get-Content -Raw install.ps1 | Invoke-Expression
          palito --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*$env:LOCALAPPDATA\palito\*") { throw "user PATH not updated: $userPath" }
      - name: install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:TAG) { $env:PALITO_VERSION = $env:TAG.TrimStart('v') }
          & ./install.ps1
          if (-not (palito list --available | Select-String qwen3-8b)) { throw 'registry not listed' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (([regex]::Matches($userPath, 'palito')).Count -ne 1) { throw "duplicate palito PATH entries: $userPath" }
