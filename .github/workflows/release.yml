# Publishes the crate and the language bindings when a vX.Y.Z tag is pushed.
# Pull requests that touch a package, and manual runs (Actions > release > Run
# workflow), are dry runs: every package is built and checked, nothing is uploaded.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CARGO_REGISTRY_TOKEN                          crates.io token (publish-new, publish-update)
#   NPM_TOKEN                                     npm granular token with publish rights
#   NUGET_API_KEY                                 NuGet key, Push scope, glob Palito*
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD Central Portal user token
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE               ASCII-armored signing key for Maven Central
# PyPI needs no secret: it uses a trusted publisher (workflow release.yml,
# environment pypi).
#
# The GitHub release with the CUDA bundle stays manual (scripts/package-linux.sh
# needs a local NVRTC 13).
name: release

on:
  push:
    tags: ["v*"]
  # Pull requests that touch a package get the dry run.
  pull_request:
    paths:
      - "Cargo.toml"
      - "bindings/**"
      - "scripts/sync_versions.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only, upload nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # A tag push publishes; a manual run only with dry_run unticked; a pull request
  # never (inputs.dry_run is null there, and null == false is true).
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Bindings match Cargo.toml (and the tag)
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            python3 scripts/sync_versions.py --check --tag "${{ github.ref_name }}"
          else
            python3 scripts/sync_versions.py --check
          fi
      - name: Unit tests of the version script
        run: python3 -m unittest discover -s scripts -p 'test_sync_versions.py'
      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

  crates:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "$PUBLISH" = true ]; then
            cargo publish --locked
          else
            cargo publish --locked --dry-run
          fi

  pypi:
    needs: version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build bindings/python
          python -m twine check bindings/python/dist/*
      - name: Upload
        if: env.PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist

  npm:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Include the license
        run: cp ../../LICENSE .
      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$PUBLISH" = true ]; then
            npm publish --access public
          else
            npm publish --access public --dry-run
          fi

  nuget:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack
        run: dotnet pack bindings/csharp/Palito/Palito.csproj -c Release -o nupkg
      - name: Push
        if: env.PUBLISH == 'true'
        run: >-
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  maven:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ env.PUBLISH == 'true' && secrets.GPG_PRIVATE_KEY || '' }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # Tests need libpalito and a model; they run outside this workflow.
        run: |
          if [ "$PUBLISH" = true ]; then
            mvn -B -f bindings/java/pom.xml -P release -DskipTests deploy
          else
            mvn -B -f bindings/java/pom.xml -P release -DskipTests -Dgpg.skip verify
          fi

  go:
    # Go modules are published by tagging bindings/go/vX.Y.Z; proxy.golang.org
    # can only fetch them from a public repository.
    needs: [version, crates, pypi, npm, nuget, maven]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the Go module
        if: env.PUBLISH == 'true' && !github.event.repository.private
        env:
          TAG: bindings/go/v${{ needs.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          curl -fsS "https://proxy.golang.org/github.com/natanloterio/palito/bindings/go/@v/v${{ needs.version.outputs.version }}.info"
      - name: Private repository
        if: github.event.repository.private
        run: echo "::warning::The repository is private, so the Go module was not published (proxy.golang.org cannot fetch it)."
