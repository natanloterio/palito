[package]
name = "local-inference"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Independent Rust GGUF inference engine with external-reference benchmarks"
default-run = "local-inference"
license = "MIT"

[features]
default = []
ktransformers = ["dep:reqwest"]
cuda = ["dep:cudarc", "dep:libloading", "dep:sha2"]
cuda-parallel-grouping-research = ["cuda"]
cuda-packed-reduction-research = ["cuda"]
cuda-qwen3-warp-reduction-research = ["cuda"]
cuda-qwen3-fused-qkv-research = ["cuda-qwen3-warp-reduction-research"]
