[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "palito"
version = "0.13.0"
description = "Ultra-fast local LLM inference for Python powered by Rust, custom CUDA/Vulkan/Metal kernels, PLT1/QTIP quantization, and native EAGLE-3 speculative decoding (up to 1,000+ tok/s on Llama 3.1 8B) — no llama.cpp or Python ML stack required."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["llm", "gguf", "inference", "cuda", "ai", "local-llm", "qwen", "llama"]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = []

[project.urls]
Homepage = "https://github.com/natanloterio/palito"
Source = "https://github.com/natanloterio/palito/tree/master/bindings/python"

[tool.setuptools]
packages = ["palito"]

[tool.setuptools.package-data]
palito = ["_lib/*/*"]
