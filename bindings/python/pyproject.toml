[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palito"
version = "0.5.0"
description = "Python binding for Palito, fast local LLM inference for GGUF models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "See the Palito repository" }
dependencies = []

[tool.setuptools]
packages = ["palito"]
