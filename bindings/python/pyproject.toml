[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "palito"
version = "0.7.1"
description = "Python binding for Palito, fast local LLM inference for GGUF models"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = []

[project.urls]
Homepage = "https://github.com/natanloterio/palito"
Source = "https://github.com/natanloterio/palito/tree/master/bindings/python"

[tool.setuptools]
packages = ["palito"]
