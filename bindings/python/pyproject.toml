[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "palito"
version = "0.11.3"
description = "Run GGUF LLMs locally from Python with custom CUDA kernels, token streaming, and structured JSON output — no llama.cpp or Python ML stack required."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["llm", "gguf", "inference", "cuda", "ai", "local-llm", "qwen", "llama"]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = []

[project.urls]
Homepage = "https://github.com/natanloterio/palito"
Source = "https://github.com/natanloterio/palito/tree/master/bindings/python"

[tool.setuptools]
packages = ["palito"]

[tool.setuptools.package-data]
palito = ["_lib/*/*"]
